name: Build Windows routing core

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download WinDivert
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile WinDivert.zip
          if ((Get-FileHash WinDivert.zip -Algorithm SHA256).Hash -ne '63CB41763BB4B20F600B6DE04E991A9C2BE73279E317D4D82F237B150C5F3F15') { throw 'WinDivert archive hash mismatch' }
          Expand-Archive WinDivert.zip -DestinationPath C:\
      - name: Build core
        shell: pwsh
        run: Windows\compile.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kokorobox-proxybridge-core-${{ github.sha }}
          path: Windows/output/
          retention-days: 30
