name: Build macOS routing extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build unsigned extension
        run: |
          xcodebuild \
            -project MacOS/ProxyBridge/ProxyBridge.xcodeproj \
            -scheme extension \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -xcconfig MacOS/ProxyBridge/kokorobox-ext.xcconfig \
            KOKOROBOX_TARGET_ARCH=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify extension product
        run: test -f build/DerivedData/Build/Products/Debug/KokoroBoxProxyExtension.systemextension/Contents/MacOS/KokoroBoxProxyExtension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kokorobox-proxybridge-extension-${{ github.sha }}
          path: build/DerivedData/Build/Products/Debug/KokoroBoxProxyExtension.systemextension
          retention-days: 7
