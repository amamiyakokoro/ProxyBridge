name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      matrix:
        include:
          - language: c-cpp
            os: windows-latest
          - language: swift
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Build Windows core
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile WinDivert.zip
          Expand-Archive WinDivert.zip -DestinationPath C:\
          Windows\compile.ps1
      - name: Build macOS extension
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project MacOS/ProxyBridge/ProxyBridge.xcodeproj -scheme extension -configuration Debug -derivedDataPath build/DerivedData -xcconfig MacOS/ProxyBridge/kokorobox-ext.xcconfig KOKOROBOX_TARGET_ARCH=arm64 CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v3
